name: FOSS-441 final formatting
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/foss-441-final-format.yml
permissions:
  contents: read
jobs:
  format:
    if: ${{ github.repository == 'LATTIX-IO/cryptoshift' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/foss-441-blocker-remediation' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/foss-441-blocker-remediation
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/cryptoshift/src crates/cryptoshift/tests crates/cryptoshift/examples
          if ! git diff --cached --quiet; then
            git commit -m "style(remediation): format final provenance changes"
            git push origin HEAD:refs/heads/feat/foss-441-blocker-remediation
          fi
