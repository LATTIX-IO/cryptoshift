name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Reject unsafe release settings
        run: python3 scripts/release_safety.py --with-cargo
      - name: Release safety regression tests
        run: python3 -m unittest discover -s scripts -p "test_release_safety.py" -v
      - name: Inspect Cargo package without publishing
        run: cargo package --locked --list -p cryptoshift
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Standalone offline peer compatibility acceptance
        shell: bash
        run: |
          output=$(cargo run -p cryptoshift --example peer_compatibility --locked)
          printf '%s\n' "$output"
          grep -Fq "status: Unknown" <<< "$output"
          grep -Fq "NegotiationMissing" <<< "$output"
          grep -Fq "No protocol negotiation was authenticated" <<< "$output"
      - name: Standalone offline remediation acceptance
        shell: bash
        run: |
          output=$(cargo run -p cryptoshift --example remediation_actions --locked)
          printf '%s\n' "$output"
          grep -Fq "blockers:" <<< "$output"
          grep -Fq "proposed actions:" <<< "$output"
          grep -Fq "No changes have been executed" <<< "$output"
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared minimum Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.85.0
      - name: Check public API and all targets on MSRV
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked
      - name: Test on MSRV
        run: cargo +1.85.0 test --workspace --all-features --locked

  supply-chain:
    name: Supply chain and SemVer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Cache pinned audit tool binaries from trusted main
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: cryptoshift-supply-chain-v1
          key: audit-0.22.2-deny-0.20.2-semver-0.51.0
          cache-bin: "true"
          add-rust-environment-hash-key: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Inspect cached audit tool versions
        id: audit-tools
        shell: bash
        run: |
          if command -v cargo-audit >/dev/null && command -v cargo-deny >/dev/null && command -v cargo-semver-checks >/dev/null && \
             cargo audit --version | grep -Fq '0.22.2' && \
             cargo deny --version | grep -Fq '0.20.2' && \
             cargo semver-checks --version | grep -Fq '0.51.0'; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'verified=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned audit tool versions on cache miss
        if: steps.audit-tools.outputs.verified != 'true'
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.51.0 cargo-semver-checks
      - name: Verify pinned audit versions
        run: |
          cargo audit --version | grep -F '0.22.2'
          cargo deny --version | grep -F '0.20.2'
          cargo semver-checks --version | grep -F '0.51.0'
      - name: RustSec audit
        run: cargo audit
      - name: Dependency policy
        run: cargo deny check
      - name: SemVer compatibility
        run: cargo semver-checks check-release --workspace --all-features
