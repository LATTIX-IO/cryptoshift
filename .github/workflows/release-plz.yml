name: Release-plz (manual proposal only)

on:
  workflow_dispatch:
    inputs:
      prepare_release_pr:
        description: Confirm preparation of a release PR (no crates.io publication)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-plz-pr:
    name: Prepare release proposal only
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'LATTIX-IO' && github.ref == 'refs/heads/main' && inputs.prepare_release_pr }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Prepare release PR (never publish)
        uses: release-plz/action@d529f731ae3e89610ada96eda34e5c6ba3b12214 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
