name: One-time FOSS-442 canonical Rustfmt
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/foss-442-format.yml
permissions:
  contents: read
jobs:
  format:
    if: ${{ github.repository == 'LATTIX-IO/cryptoshift' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/foss-442-wave-planner-readiness' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/foss-442-wave-planner-readiness
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt
      - name: Canonically format Rust sources
        run: cargo fmt --all
      - name: Push branch-local formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/cryptoshift/src crates/cryptoshift/tests crates/cryptoshift/examples
          if ! git diff --cached --quiet; then
            git commit -m "style(wave): canonical Rustfmt output"
            git push origin HEAD:refs/heads/feat/foss-442-wave-planner-readiness
          fi
